<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><meta name="description" content="Pixel art editor with a resizable grid, brush, undo, image import and PNG export."><title>PixelPad</title><style>body{margin:0;background:#0b1020;color:#edf2ff;font:15px system-ui}main{max-width:1050px;margin:auto;padding:25px 18px}header{color:#a5b4fc;display:flex;justify-content:space-between;font-weight:800}.hero{padding:28px 0}.hero h1{font-size:40px}.muted,small{color:#9aa8c3}.layout{display:grid;grid-template-columns:250px 1fr;gap:14px}.panel{background:#151e31;border:1px solid #30405a;border-radius:15px;padding:16px}.stack{display:grid;gap:11px}button,input,select,textarea{font:inherit}button{background:#a5b4fc;color:#111827;border:0;border-radius:9px;padding:10px;cursor:pointer;font-weight:700}button.secondary{background:#30405a;color:white}input,select,textarea{background:#0e1729;color:white;border:1px solid #394a65;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}label{display:grid;gap:5px;color:#b4c0d4;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.item{border:1px solid #394a65;padding:10px;border-radius:9px;margin:7px 0}footer{text-align:center;color:#8997b0;padding:25px}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero h1{font-size:33px}}</style></head><body><main><header><span>ERROR404DTIR / OPEN SOURCE</span><small>LOCAL · FREE · NO BUILD</small></header><section class="hero"><small>SMALL TOOL / BIG UTILITY</small><h1>PixelPad</h1><p class="muted">Pixel art editor with a resizable grid, brush, undo, image import and PNG export.</p></section><label>Grid <select id="n"><option>16</option><option selected>32</option><option>64</option></select></label><label>Color <input id="col" type="color" value="#89b4fa"></label><button id="undo">Undo</button><button id="clear">Clear</button><label>Import <input id="file" type="file" accept="image/*"></label><button id="save">Export PNG</button><canvas id="c" width="512" height="512" style="width:100%;background:white;touch-action:none;image-rendering:pixelated"></canvas><footer>Runs locally in your browser · No account required</footer></main><script>const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d');let n=32,p=[],h=[],down=false;function init(){p=Array.from({length:n},()=>Array(n).fill(''));draw()}function draw(){g.fillStyle='white';g.fillRect(0,0,512,512);let s=512/n;p.forEach((r,y)=>r.forEach((v,x)=>{if(v){g.fillStyle=v;g.fillRect(x*s,y*s,s,s)}}));g.strokeStyle='#ddd';for(let i=0;i<=n;i++){g.beginPath();g.moveTo(i*s,0);g.lineTo(i*s,512);g.stroke();g.beginPath();g.moveTo(0,i*s);g.lineTo(512,i*s);g.stroke()}}function paint(e){let r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*n),y=Math.floor((e.clientY-r.top)/r.height*n);if(x>=0&&y>=0&&x<n&&y<n){p[y][x]=e.buttons===2?'':$('col').value;draw()}}c.onpointerdown=e=>{down=true;h.push(p.map(r=>r.slice()));c.setPointerCapture(e.pointerId);paint(e)};c.onpointermove=e=>down&&paint(e);c.onpointerup=()=>down=false;c.oncontextmenu=e=>e.preventDefault();$('n').onchange=()=>{n=+$('n').value;h=[];init()};$('undo').onclick=()=>{if(h.length){p=h.pop();draw()}};$('clear').onclick=()=>{h.push(p.map(r=>r.slice()));init()};$('file').onchange=async e=>{let im=await createImageBitmap(e.target.files[0]),t=document.createElement('canvas');t.width=t.height=n;t.getContext('2d').drawImage(im,0,0,n,n);let d=t.getContext('2d').getImageData(0,0,n,n).data;p=Array.from({length:n},(_,y)=>Array.from({length:n},(_,x)=>{let i=(y*n+x)*4;return d[i+3]?'#'+[d[i],d[i+1],d[i+2]].map(v=>v.toString(16).padStart(2,'0')).join(''):''}));draw()};$('save').onclick=()=>{let t=document.createElement('canvas');t.width=t.height=n*16;let q=t.getContext('2d');q.imageSmoothingEnabled=false;p.forEach((r,y)=>r.forEach((v,x)=>{if(v){q.fillStyle=v;q.fillRect(x*16,y*16,16,16)}}));let a=document.createElement('a');a.href=t.toDataURL();a.download='pixelpad.png';a.click()};init();</script></body></html>
